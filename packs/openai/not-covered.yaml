- items:
    - "2026-11-02 api-schema-removed `LiveTransportDTMFSend`"
  reason: >-
    A server event, not something code sends: it was the event a Live sideband observer receives
    after a keypress reaches the SIP trunk, described as not a client command. It is now
    LiveTransportDTMFSent, with type transport.dtmf.sent where it had transport.dtmf.send, so code
    that waits for transport.dtmf.send to confirm a keypress no longer sees it. darnit finds what
    code sends, and transport.dtmf.send is now the type of the client command
    LiveTransportDTMFSendParam, so matching that text would also flag code sending the command.
    Shown by comparing the Live server events in the snapshot before this removal with this one.
