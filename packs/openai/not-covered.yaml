    - schema CreateImageVariationRequest
  needs-record: >-
    Breaking, report-only. The spec says the endpoint is retired. Finds images.createVariation
    (JavaScript) and images.create_variation (Python) calls and raw HTTP calls to
    /v1/images/variations. The replacement is an image edit with a GPT image model, which takes
    different inputs, so there is nothing to rewrite.

