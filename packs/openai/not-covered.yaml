# Every item OpenAI's spec marks deprecated, and every removal the corpus history logged, that no
# change record covers, with the reason it has none. `npm run accounting` checks this file against
# corpus/openai: an item missing from it fails, and so does an entry for an item that is gone or
# that a record now covers. An entry with needs-record instead of reason stays open and is listed
# on every run, with the record it should get.
#
# Keys are what `npm run accounting` prints. Records cover items on their own when they can:
# a schema property when every endpoint whose request reaches the schema has a record for that
# field, and an enum value when a record's patterns name it.

# Request side, still open

- items:
    - GET /assistants
    - POST /assistants
    - GET /assistants/{assistant_id}
    - POST /assistants/{assistant_id}
    - DELETE /assistants/{assistant_id}
  needs-record: >-
    Deprecation, report-only. Finds beta.assistants create, retrieve, update, delete and list
    calls in JavaScript and Python, and raw HTTP calls to /v1/assistants. Moving to the Responses
    API is a redesign, so there is nothing to rewrite.

- items:
