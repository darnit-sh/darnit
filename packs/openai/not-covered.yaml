# Every item OpenAI's spec marks deprecated, every removal the corpus history logged, and every
# row of the deprecations page rows in corpus/openai/page-rows.json, that no change record covers,
# with the reason it has none. `npm run accounting` checks this file against
# corpus/openai: an item missing from it fails, and so does an entry for an item that is gone or
# that a record now covers. An entry with needs-record instead of reason stays open and is listed
# on every run, soonest date first, with the record it should get; date is the day OpenAI gives
# for the change, when it gives one.
#
# Keys are what `npm run accounting` prints, quoted the same way. Records cover items on their own
# when they can: an operation by a record for its endpoint or SDK call; a request schema or one of
# its properties when every operation whose request reaches it has a record, for that field when
# there is one; an enum value when a record for a field that holds it names that value; and a
# model of a page row when a record detects it. A page row with no model is keyed by its cells as
# JSON, so its key is written here in double quotes with JSON's escapes.
#
# A reason says only what a command shows: `darnit check` on a sample call, or a comparison of the
# spec snapshots in git history.

