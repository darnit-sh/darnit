id: openai-max-tokens-to-max-completion-tokens-js
language: javascript
# Only a direct property of the options object passed to
# chat.completions.create(...): `max_tokens` is a live, correct parameter on
# other APIs (Anthropic messages.create), and on calls nested inside the
# options. Call sites that pass a config object built elsewhere are not
# matched; see change.json edgeCases. check notes this limit in every report.
rule:
  pattern:
    context: '({ max_tokens: $N })'
    selector: pair
  inside:
    kind: object
    inside:
      kind: arguments
      inside:
        kind: call_expression
        has:
          field: function
          regex: 'chat\.completions\.create$'
fix: 'max_completion_tokens: $N'
