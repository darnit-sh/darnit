# Vendors whose OpenAPI specs darnit watches. Adding one here is all it takes
# for the weekly corpus run to start producing candidate change records.
#
# symbols map "METHOD /path" in the spec to the SDK call users write, so a
# detected change is only reported inside that call and not on a same-named
# parameter of some other API.

openai:
  spec: https://raw.githubusercontent.com/openai/openai-openapi/main/openapi.yaml
  symbols:
    "POST /chat/completions": chat.completions.create
    "POST /responses": responses.create
    "POST /completions": completions.create
    "POST /embeddings": embeddings.create
    "POST /images/generations": images.generate
    "POST /images/edits": images.edit
    "POST /audio/transcriptions": audio.transcriptions.create
    "POST /audio/translations": audio.translations.create
    "POST /audio/speech": audio.speech.create
    "POST /moderations": moderations.create
    "POST /files": files.create
    "POST /fine_tuning/jobs": fine_tuning.jobs.create
    "POST /batches": batches.create
    "POST /assistants": assistants.create
    "POST /threads": threads.create
    "POST /threads/{thread_id}/runs": threads.runs.create
    "POST /threads/{thread_id}/messages": threads.messages.create
    "POST /vector_stores": vector_stores.create
