name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A new push or edit cancels the older run for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The title becomes the commit subject on main, and the commits stay on the pull request page.
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-pr.sh "$BASE" "$HEAD"

  # One rule per title type (scripts/check-refactor.sh). Runs again when the title or body is edited.
  # Base's copy of the scripts decides, so a change cannot loosen the rule it is checked by.
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: table
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git archive "$BASE" scripts | tar -x -C "$RUNNER_TEMP"
          printf "Rule from base's scripts/check-refactor.sh\n\n" | tee -a "$GITHUB_STEP_SUMMARY"
          sh "$RUNNER_TEMP/scripts/check-refactor.sh" "$BASE" "$HEAD"
      - if: steps.table.outputs.base-tests == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.table.outputs.base-tests == 'true'
        run: npm ci
      - if: steps.table.outputs.base-tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      - if: steps.table.outputs.base-tests == 'true'
        run: sh "$RUNNER_TEMP/scripts/check-refactor.sh" --base-tests "$BASE"

  # A fix or feat that changes code or a rule pack brings a test that fails without it (scripts/check-proof.sh).
  # Runs again when the title or body is edited, with base's copy of the scripts when base has one.
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: table
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if git cat-file -e "$BASE:scripts/check-proof.sh" 2>/dev/null; then
            git archive "$BASE" scripts | tar -x -C "$RUNNER_TEMP"
            copy="base's scripts/check-proof.sh"
          else
            cp -R scripts "$RUNNER_TEMP/"
            copy="this change's scripts/check-proof.sh, since base has none"
          fi
          printf 'Rule from %s\n\n' "$copy" | tee -a "$GITHUB_STEP_SUMMARY"
          sh "$RUNNER_TEMP/scripts/check-proof.sh" "$BASE" "$HEAD"
      - if: steps.table.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.table.outputs.run == 'true'
        run: npm ci
      - if: steps.table.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      - if: steps.table.outputs.run == 'true'
        run: sh "$RUNNER_TEMP/scripts/check-proof.sh" --run "$BASE" "$HEAD"
