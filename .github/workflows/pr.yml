name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # A merge queue waits for every required check. Each job here passes there without reading anything
  # (scripts/pr-common.sh), as the queue admits only pull requests whose own run passed.
  merge_group:

permissions:
  contents: read

# A new push or edit cancels the older run for the same pull request. Each merge queue run gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The title becomes the commit subject on main, and the commits stay on the pull request page.
  # Base's copy of the script decides when base has one, so a change cannot loosen the check it is judged by.
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if git cat-file -e "$BASE:scripts/check-pr.sh" 2>/dev/null; then
            git archive -o "$RUNNER_TEMP/scripts.tar" "$BASE" scripts
            tar -x -f "$RUNNER_TEMP/scripts.tar" -C "$RUNNER_TEMP"
            copy="base's scripts/check-pr.sh"
          else
            cp -R scripts "$RUNNER_TEMP/"
            copy="this change's scripts/check-pr.sh, since base has none"
          fi
          printf 'Check from %s\n\n' "$copy" | tee -a "$GITHUB_STEP_SUMMARY"
          sh "$RUNNER_TEMP/scripts/check-pr.sh" "$BASE" "$HEAD"

  # One rule per title type (scripts/check-refactor.sh). Runs again when the title or body is edited.
  # Base's copy of the scripts decides, so a change cannot loosen the rule it is checked by.
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # npm runs scripts and npx with this shell whatever an .npmrc in the change says: npm reads
      # npm_config_* variables after project config, so they win.
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: table
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          git archive -o "$RUNNER_TEMP/scripts.tar" "$BASE" scripts
          tar -x -f "$RUNNER_TEMP/scripts.tar" -C "$RUNNER_TEMP"
          printf "Rule from base's scripts/check-refactor.sh\n\n" | tee -a "$GITHUB_STEP_SUMMARY"
          sh "$RUNNER_TEMP/scripts/check-refactor.sh" "$BASE" "$HEAD"
      - if: steps.table.outputs.base-tests == 'true' || steps.table.outputs.style == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Found before any code of this change runs, for the step that judges it.
      - if: steps.table.outputs.base-tests == 'true' || steps.table.outputs.style == 'true'
        id: node
        run: echo "dir=$(dirname "$(command -v node)")" >> "$GITHUB_OUTPUT"
      # No install script of this change runs. The one darnit's dependencies need comes from the registry
      # package the lock names, which the dependency source check holds to what the registry published;
      # --node-options= drops any an .npmrc in the change sets for it. A style change leaves the lock as its
      # merge base has it, so this installs the registry's prettier at the version the merge base pins, and
      # --style refuses unless that is the version base pins.
      - if: steps.table.outputs.base-tests == 'true' || steps.table.outputs.style == 'true'
        run: |
          npm ci --ignore-scripts
          npm rebuild @ast-grep/cli --node-options=
      - if: steps.table.outputs.base-tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      # Judged by base's scripts, taken fresh into a new folder, run by absolute path with system tools and
      # inputs set on this step. The runner puts what earlier steps wrote to $GITHUB_PATH before any PATH set
      # here, so PATH is set in the script, and the shell is named by path. git reads commits as they are:
      # no replace ref, and no graft file, as no file can be made under /dev/null.
      - if: steps.table.outputs.base-tests == 'true'
        shell: /bin/sh -e {0}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT: ${{ github.event_name }}
          NODE: ${{ steps.node.outputs.dir }}
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_GRAFT_FILE: /dev/null/grafts
        run: |
          PATH=$NODE:/usr/bin:/bin
          dir=$(mktemp -d)
          git archive -o "$dir/scripts.tar" "$BASE" scripts
          tar -x -f "$dir/scripts.tar" -C "$dir"
          /bin/sh "$dir/scripts/check-refactor.sh" --base-tests "$BASE"
      # As above. --style loads prettier from node_modules by path.
      - if: steps.table.outputs.style == 'true'
        shell: /bin/sh -e {0}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
          NODE: ${{ steps.node.outputs.dir }}
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_GRAFT_FILE: /dev/null/grafts
        run: |
          PATH=$NODE:/usr/bin:/bin
          dir=$(mktemp -d)
          git archive -o "$dir/scripts.tar" "$BASE" scripts
          tar -x -f "$dir/scripts.tar" -C "$dir"
          /bin/sh "$dir/scripts/check-refactor.sh" --style "$BASE" "$HEAD"

  # A fix or feat that changes code or a rule pack brings a test that fails without it (scripts/check-proof.sh).
  # Runs again when the title or body is edited, with base's copy of the scripts when base has one.
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: table
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if git cat-file -e "$BASE:scripts/check-proof.sh" 2>/dev/null; then
            git archive -o "$RUNNER_TEMP/scripts.tar" "$BASE" scripts
            tar -x -f "$RUNNER_TEMP/scripts.tar" -C "$RUNNER_TEMP"
            copy="base's scripts/check-proof.sh"
          else
            cp -R scripts "$RUNNER_TEMP/"
            copy="this change's scripts/check-proof.sh, since base has none"
          fi
          printf 'Rule from %s\n\n' "$copy" | tee -a "$GITHUB_STEP_SUMMARY"
          sh "$RUNNER_TEMP/scripts/check-proof.sh" "$BASE" "$HEAD"
      - if: steps.table.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.table.outputs.run == 'true'
        id: node
        run: echo "dir=$(dirname "$(command -v node)")" >> "$GITHUB_OUTPUT"
      # As in the refactor job.
      - if: steps.table.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          npm rebuild @ast-grep/cli --node-options=
      - if: steps.table.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      # As in the refactor job, with this change's scripts when base has none.
      - if: steps.table.outputs.run == 'true'
        shell: /bin/sh -e {0}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
          NODE: ${{ steps.node.outputs.dir }}
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_GRAFT_FILE: /dev/null/grafts
        run: |
          PATH=$NODE:/usr/bin:/bin
          dir=$(mktemp -d)
          rev=$BASE
          git cat-file -e "$BASE:scripts/check-proof.sh" 2>/dev/null || rev=$HEAD
          git archive -o "$dir/scripts.tar" "$rev" scripts
          tar -x -f "$dir/scripts.tar" -C "$dir"
          /bin/sh "$dir/scripts/check-proof.sh" --run "$BASE" "$HEAD"
