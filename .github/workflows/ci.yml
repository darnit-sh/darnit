name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs every job on the merged result, with main's full matrix.
  merge_group:

permissions:
  contents: read

# bash, not GitHub's default bash -e, so a step fails when any command in a pipe fails, not only the last.
defaults:
  run:
    shell: bash

# A new push to a pull request cancels its older run. Each run on main gets its own group, so none is
# cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each limit is twice the job's slowest of its latest successful runs, rounded up to 5 minutes
# (test/workflow-limits.test.ts): test 9m41s on ubuntu and 8m53s on macOS, package 2m02s, lint 1m19s.
# A job's wait for a runner counts toward its limit: macOS test jobs were cancelled at 15 minutes with no
# runner and no step run. macOS jobs get 30 minutes more. The merge queue's status check timeout (60 minutes)
# must stay above every limit here and in golden.yml.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # npm runs scripts and npx with this shell whatever an .npmrc in the change says: npm reads
      # npm_config_* variables after project config, so they win.
      npm_config_script_shell: /bin/sh
      # Lint and typecheck need no install scripts, and this also skips pre and post scripts.
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Install scripts and tests run with whatever git config holds; it must hold no GitHub token.
      - run: "! git config --name-only --get-regexp '^http\\..*\\.extraheader$'"
      - run: npm run lint
      # Every code file as the pinned prettier writes it (.prettierignore leaves out the rest). Its limit is the rule
      # above applied to the step: it took 4s on a local run, so 5.
      - run: npm run format:check
        timeout-minutes: 5
      - run: npm run typecheck
      # Unused files, exports and dependencies, and duplicated blocks, each checked against its list in scripts/allow/.
      # Each limit is the rule above applied to the step: it took 1s (knip) and under 1s (duplicates) in this job's
      # last run with them, so twice that rounded up to 5 minutes is 5. The job's limit stays 5.
      - run: npm run knip
        timeout-minutes: 5
      - run: npm run duplicates
        timeout-minutes: 5
      # The size and shape limits of scripts/limits.ts on src/, checked against scripts/allow/limits.tsv. Its limit is
      # the rule above applied to the step: it took 2s on a local run, so 5.
      - run: npm run limits
        timeout-minutes: 5

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
        # Pull requests skip macOS on Node 24 and 26; main runs all six.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","node":24},{"os":"macos-latest","node":26}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 50 || 20 }}
    env:
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The coverage step reads the thresholds on the first parent: base on a pull request, the commit before on main.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The corpus tests shell out to oasdiff. Keep the pinned release between
      # runs so a GitHub download hiccup cannot fail the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      - run: npx tsx -e "import('./src/corpus/oasdiff.ts').then((m) => m.oasdiffBinary()).then(console.log)"
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      # One runner measures coverage against coverage-thresholds.json. Coverage slows the code the cpu-time
      # tests time, so that runner runs them in a pass of their own.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm test -- --coverage --tags-filter='!cpu-time'
      # A folder this change adds to coverage-thresholds.json starts at or above what the step above measured.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: sh scripts/check-coverage.sh --new-keys HEAD^1 coverage/coverage-summary.json
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm test -- --tags-filter=cpu-time
      # Every pack's rules against its fixtures. Zero matches where fixtures
      # expect some is a failure, not a skip.
      - run: npm run test:fixtures
      # Every deprecation in OpenAI's spec and every removal the corpus logged is covered by a
      # record or has a reason in packs/openai/not-covered.yaml.
      - run: npm run accounting

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
        # Pull requests skip macOS on Node 24 and 26; main runs all six.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","node":24},{"os":"macos-latest","node":26}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 35 || 5 }}
    env:
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Packs the tarball npm would publish, installs it fresh, and runs
      # init, check and fix against every scenario in test/e2e.
      - run: npm run test:e2e

  # The built CLI on the largest input it accepts, each case a child killed at 5 minutes (scripts/watchdog.ts):
  # a test's own time limit cannot stop a synchronous loop, so a hang fails here and names its input. The limit
  # covers a whole run, one case killed, and a case started just before it running to the kill too.
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx scripts/watchdog.ts

  # Compares scan results on pinned real repositories with their stored files (golden.yml).
  golden:
    uses: ./.github/workflows/golden.yml

  # Every model-name mention darnit reports on the pinned repositories agrees with a plain search for the same ids,
  # or differs by a rule in scripts/answer-key.ts. Reads the clones golden caches on main.
  answer-key:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      npm_config_script_shell: /bin/sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit-golden
          key: golden-${{ hashFiles('test/golden/repos.tsv') }}
      - run: time npm run answer-key
