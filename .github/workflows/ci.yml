name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The corpus tests shell out to oasdiff. Keep the pinned release between
      # runs so a GitHub download hiccup cannot fail the build.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      - run: npx tsx -e "import('./src/corpus/oasdiff.ts').then((m) => m.oasdiffBinary()).then(console.log)"
      - run: npm test
      # Every pack's rules against its fixtures. Zero matches where fixtures
      # expect some is a failure, not a skip.
      - run: npm run test:fixtures

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Packs the tarball npm would publish, installs it fresh, and runs
      # init, check and fix against every scenario in test/e2e.
      - run: npm run test:e2e
