name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each run on main gets its own group, so none is
# cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The slowest job has taken under 2 minutes; the timeout stops a hung test long before
# GitHub's 6 hour default.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Install scripts and tests run with whatever git config holds; it must hold no GitHub token.
      - run: "! git config --name-only --get-regexp '^http\\..*\\.extraheader$'"
      - run: npm run lint
      - run: npm run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        # Pull requests skip macOS on Node 24; main runs all four.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","node":24}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The corpus tests shell out to oasdiff. Keep the pinned release between
      # runs so a GitHub download hiccup cannot fail the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/darnit
          key: oasdiff-${{ runner.os }}-${{ hashFiles('src/corpus/oasdiff.ts') }}
      - run: npx tsx -e "import('./src/corpus/oasdiff.ts').then((m) => m.oasdiffBinary()).then(console.log)"
      - run: npm test
      # Every pack's rules against its fixtures. Zero matches where fixtures
      # expect some is a failure, not a skip.
      - run: npm run test:fixtures

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        # Pull requests skip macOS on Node 24; main runs all four.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","node":24}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Packs the tarball npm would publish, installs it fresh, and runs
      # init, check and fix against every scenario in test/e2e.
      - run: npm run test:e2e

  # Compares scan results on pinned real repositories with their stored files (golden.yml).
  golden:
    uses: ./.github/workflows/golden.yml
