name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the corpus tests shell out to oasdiff; fetch the pinned release once
      - run: npx tsx -e "import('./src/corpus/oasdiff.ts').then((m) => m.oasdiffBinary()).then(console.log)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Every pack's rules against its fixtures. Zero matches where fixtures
      # expect some is a failure, not a skip.
      - run: npm run test:fixtures
