name: corpus

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Install scripts and tests run with whatever git config holds; it must hold no GitHub token.
      - run: "! git config --name-only --get-regexp '^http\\..*\\.extraheader$'"
      - run: npm run corpus | tee "$RUNNER_TEMP/corpus.log"
      - id: changes
        run: echo "count=$(git status --porcelain | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.count != '0'
        run: npm run check
      # The app's token can push and open pull requests, and CI runs on them. It is made only
      # after everything that runs dependency code.
      - if: steps.changes.outputs.count != '0'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_KEY }}
      - if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name darnit
          git config user.email darnit@users.noreply.github.com
          branch="corpus/$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          git add corpus packs
          git commit -m "feat(corpus): refresh vendor specs"
          git push -u origin "$branch"
          gh pr create --base main --title "feat(corpus): new vendor changes" --body-file "$RUNNER_TEMP/corpus.log"
