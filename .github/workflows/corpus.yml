name: corpus

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # npm runs scripts and npx with this shell whatever an .npmrc in the checkout says: npm reads
      # npm_config_* variables after project config, so they win.
      npm_config_script_shell: /bin/sh
    outputs:
      count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Install scripts and tests run with whatever git config holds; it must hold no GitHub token.
      - run: "! git config --name-only --get-regexp '^http\\..*\\.extraheader$'"
      - run: npm ci
      - run: npm run corpus | tee "$RUNNER_TEMP/corpus.log"
      - id: changes
        run: echo "count=$(git status --porcelain | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.count != '0'
        run: npm run check
      - if: steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus
          path: |
            corpus
            packs
      - if: steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-log
          path: ${{ runner.temp }}/corpus.log

  # Dependency code in the job above can leave hooks or processes behind, so the app's token
  # (which can push and open pull requests) is made only on a machine that never runs it.
  open-pr:
    needs: refresh
    if: needs.refresh.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-log
          path: ${{ runner.temp }}/log
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          rm -rf corpus packs
          cp -R "$RUNNER_TEMP/corpus/corpus" "$RUNNER_TEMP/corpus/packs" .
          git config user.name darnit
          git config user.email darnit@users.noreply.github.com
          branch="corpus/$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          git add corpus packs
          git commit -m "feat(corpus): refresh vendor specs"
          git push -u origin "$branch"
          gh pr create --base main --title "feat(corpus): new vendor changes" --body-file "$RUNNER_TEMP/log/corpus.log"
