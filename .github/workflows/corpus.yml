name: corpus

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Install scripts and tests run with whatever git config holds; it must hold no GitHub token.
      - run: "! git config --name-only --get-regexp '^http\\..*\\.extraheader$'"
      - run: npm run corpus | tee "$RUNNER_TEMP/corpus.log"
      # Breach test: stands in for a dependency's install script.
      - run: |
          printf '#!/bin/sh\necho "breach: pre-push hook sees GH_TOKEN of ${#GH_TOKEN} chars"\nexit 1\n' > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
          nohup sh -c 'for i in $(seq 900); do for e in /proc/[0-9]*/environ; do if tr "\0" "\n" < "$e" 2>/dev/null | grep -q "^GH_TOKEN=."; then echo "breach: background process read GH_TOKEN from $e" > /tmp/breach.log; exit 0; fi; done; sleep 1; done' > /dev/null 2>&1 &
      - id: changes
        run: echo "count=$(git status --porcelain | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.count != '0'
        run: npm run check
      - if: steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus
          path: |
            corpus
            packs
      - if: steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-log
          path: ${{ runner.temp }}/corpus.log
      - if: always()
        run: cat /tmp/breach.log || echo "no breach log"

  # Dependency code in the job above can leave hooks or processes behind, so the app's token
  # (which can push and open pull requests) is made only on a machine that never runs it.
  open-pr:
    needs: refresh
    if: needs.refresh.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-log
          path: ${{ runner.temp }}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          rm -rf corpus packs
          cp -R "$RUNNER_TEMP/corpus/corpus" "$RUNNER_TEMP/corpus/packs" .
          git config user.name darnit
          git config user.email darnit@users.noreply.github.com
          branch="corpus/$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          git add corpus packs
          git commit -m "feat(corpus): refresh vendor specs"
          git push -u origin "$branch"
          gh pr create --base main --title "feat(corpus): new vendor changes" --body-file "$RUNNER_TEMP/corpus.log"
      - if: always()
        run: ls -a .git/hooks; cat /tmp/breach.log || echo "no breach log on this machine"
