name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Dependency code runs here, so this job gets no way to publish.
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache here: a release builds only from what the lockfile names.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dist_tag=$(sh scripts/check-release.sh "$TAG" "$GITHUB_SHA")
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: "! git config --name-only --get-regexp '^http\\..*\\.extraheader$'"
      - run: npm run check
      - run: npm run build
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error

  # Waits for a maintainer's approval, then publishes the tarball built above without running
  # any project or dependency code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Publishing with a short-lived identity instead of a token needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.20.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --provenance --access public --tag "$DIST_TAG" --ignore-scripts

  # Installs what npm now serves, the way users get it, and checks that it runs.
  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: sh scripts/verify-release.sh "$VERSION"
