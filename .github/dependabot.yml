version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime dependencies are exact pins, and an update moves the pin. The default may treat a
    # published package as a library and widen the range instead.
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      # vitest and its coverage plugin must stay on the same version, so they move together, majors too.
      vitest:
        patterns: [vitest, "@vitest/*"]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
        # The tools behind a check (formatter, unused code, duplicates) change what the check reports
        # between versions, so each comes alone, where its findings and breach tests can be rerun.
        exclude-patterns: [prettier, knip, jscpd]
    ignore:
      # Types must match the oldest Node we support, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
