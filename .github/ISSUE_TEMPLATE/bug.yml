name: Bug report
description: darnit did something wrong or crashed.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran and its output.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`darnit --version`, `node --version` and your OS."
      placeholder: darnit 0.2.0, Node 22.12.0, macOS 15
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Smallest code that shows it
      description: A few lines are enough. Leave out secrets and private code.
      render: text
