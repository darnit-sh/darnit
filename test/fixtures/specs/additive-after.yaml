openapi: 3.0.0
info: { title: t, version: "1" }
paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Req'
      responses:
        "200": { description: ok }
  /edits:
    post:
      operationId: createEdit
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { input: { type: string } } }
      responses:
        "200": { description: ok }
  /responses:
    post:
      operationId: createResponse
      responses:
        "200": { description: ok }
components:
  schemas:
    Req:
      type: object
      properties:
        max_tokens: { type: integer }
        functions: { type: array, items: { type: object } }
        old_name: { type: string }
        temperature: { type: number }
        service_tier: { type: string, enum: [auto, fast] }
