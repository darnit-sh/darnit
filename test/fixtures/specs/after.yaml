openapi: 3.0.0
info: { title: t, version: "1" }
paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Req'
      responses:
        "200": { description: ok }
components:
  schemas:
    Req:
      type: object
      properties:
        max_tokens:
          type: integer
          deprecated: true
          description: |
            The maximum number of tokens to generate.

            This value is now deprecated in favor of `max_completion_tokens`, and is
            not compatible with reasoning models.
        max_completion_tokens: { type: integer }
        functions: { type: array, items: { type: object }, deprecated: true, description: "Deprecated. A list of functions the model may generate JSON inputs for." }
        new_name: { type: string }
        temperature: { type: number, enum: [0, 1, 2] }
